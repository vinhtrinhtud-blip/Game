<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mèo Vũ Trụ — Game trình duyệt</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #080d20;
      color: #f7f5ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #28215b 0, transparent 55%),
        #080d20;
    }

    main { width: min(900px, 100%); }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 0 2px 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #b7b6d5;
      font-size: 14px;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid #474274;
      border-radius: 999px;
      padding: 7px 12px;
      color: #d7ceff;
      background: #201c40;
      font-size: 12px;
      font-weight: 700;
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid #575187;
      border-radius: 22px;
      background: #101534;
      box-shadow: 0 24px 80px #0008, 0 0 45px #7865ff20;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 500;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1027a8;
      backdrop-filter: blur(5px);
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .card {
      width: min(390px, 100%);
      border: 1px solid #7167a8;
      border-radius: 22px;
      padding: 27px 24px 24px;
      background: linear-gradient(145deg, #24214aef, #151b39f2);
      box-shadow: 0 18px 60px #060817a8;
    }

    .cat-icon { font-size: 45px; line-height: 1; }

    .card h2 {
      margin: 12px 0 7px;
      font-size: 25px;
    }

    .card p {
      margin: 0 auto 18px;
      color: #d0cfe7;
      line-height: 1.55;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      color: #18132e;
      background: linear-gradient(100deg, #ffd36e, #ffab78);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 20px #ffbd5c30;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .help {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 24px;
      margin: 13px 0 0;
      color: #c3c1dc;
      font-size: 13px;
    }

    .help strong { color: #fff0bd; }

    @media (max-width: 560px) {
      body { padding: 16px 12px; }
      .heading { align-items: start; }
      .badge { margin-top: 5px; }
      .help { gap: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <h1>Mèo Vũ Trụ</h1>
        <p class="subtitle">Phi công mèo đang cần tiếp tế cà phê!</p>
      </div>
      <div class="badge">GAME MINI · 1 PHÚT</div>
    </header>

    <section class="game-shell" aria-label="Trò chơi Mèo Vũ Trụ">
      <canvas id="game" width="800" height="500" aria-label="Điều khiển tàu mèo để hứng cà phê và né thiên thạch"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="cat-icon" aria-hidden="true">🐱</div>
          <h2 id="overlay-title">Sẵn sàng cất cánh?</h2>
          <p id="overlay-copy">Hứng cà phê để ghi điểm, né thiên thạch để giữ 3 mạng nhé!</p>
          <button id="start-button" type="button">Bắt đầu chơi</button>
        </div>
      </div>
    </section>

    <p class="help">
      <span><strong>← →</strong> hoặc <strong>A / D</strong> để bay</span>
      <span>Điện thoại: chạm và kéo</span>
      <span>☕ +10 điểm</span>
      <span>☄️ Né thiên thạch</span>
    </p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const startButton = document.querySelector("#start-button");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayCopy = document.querySelector("#overlay-copy");
      const width = canvas.width;
      const height = canvas.height;
      const keys = new Set();
      const stars = Array.from({ length: 85 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.8 + .5,
        speed: Math.random() * 22 + 10
      }));
      const player = { x: width / 2, y: height - 76, targetX: width / 2 };
      let objects = [];
      let score = 0;
      let lives = 3;
      let spawnTimer = 0;
      let lastTime = 0;
      let state = "ready";
      let hitFlash = 0;

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawBackground(dt) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#11183d");
        sky.addColorStop(1, "#261c50");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(610, 94, 8, 610, 94, 220);
        glow.addColorStop(0, "#f5a9da27");
        glow.addColorStop(1, "#f5a9da00");
        ctx.fillStyle = glow;
        ctx.fillRect(360, 0, 440, 330);

        for (const star of stars) {
          if (state === "playing") star.y = (star.y + star.speed * dt) % height;
          ctx.globalAlpha = .45 + Math.sin(star.x + star.y) * .3;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffffff0b";
        ctx.beginPath();
        ctx.ellipse(112, 338, 175, 74, -.3, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawCoffee(x, y, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.shadowColor = "#ffc96a99";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#fff0d5";
        roundedRect(-13, -15, 26, 29, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#8b503b";
        roundedRect(-11, -11, 22, 7, 3);
        ctx.fill();
        ctx.strokeStyle = "#fff0d5";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(14, -2, 7, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.strokeStyle = "#f3d9ba";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-5, -20); ctx.quadraticCurveTo(-10, -26, -5, -30);
        ctx.moveTo(5, -20); ctx.quadraticCurveTo(0, -26, 5, -30);
        ctx.stroke();
        ctx.restore();
      }

      function drawAsteroid(x, y, radius, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillStyle = "#ff7186";
        ctx.strokeStyle = "#ffc0b8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 9; i++) {
          const angle = i * Math.PI * 2 / 9;
          const r = radius * (i % 2 ? .82 : 1 + (i % 3) * .08);
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#cf526c";
        ctx.beginPath(); ctx.arc(-5, -3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(7, 6, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawShip() {
        const x = player.x;
        const y = player.y;
        const flame = 10 + Math.random() * 12;

        ctx.save();
        ctx.translate(x, y);
        ctx.shadowColor = "#ff9d67aa";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#ff9f61";
        ctx.beginPath();
        ctx.moveTo(-10, 26); ctx.lineTo(0, 26 + flame); ctx.lineTo(10, 26);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#67b8fa";
        ctx.strokeStyle = "#e7f4ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-19, 7); ctx.lineTo(-38, 22); ctx.lineTo(-16, 23); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(19, 7); ctx.lineTo(38, 22); ctx.lineTo(16, 23); ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#f5f6ff";
        ctx.strokeStyle = "#566091";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -37);
        ctx.bezierCurveTo(22, -24, 25, 4, 17, 26);
        ctx.lineTo(-17, 26);
        ctx.bezierCurveTo(-25, 4, -22, -24, 0, -37);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#6573ba";
        ctx.beginPath(); ctx.ellipse(0, -5, 14, 17, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd19b";
        ctx.beginPath(); ctx.ellipse(0, -2, 10, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#202343";
        ctx.beginPath(); ctx.ellipse(-4, -4, 1.7, 2.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(4, -4, 1.7, 2.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f17c9b";
        ctx.beginPath(); ctx.moveTo(-2, 1); ctx.lineTo(2, 1); ctx.lineTo(0, 4); ctx.fill();
        ctx.strokeStyle = "#9c5261";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(-2, 3, 3, 0, Math.PI / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(2, 3, 3, Math.PI / 2, Math.PI); ctx.stroke();
        ctx.restore();
      }

      function drawHud() {
        ctx.fillStyle = "#fff";
        ctx.font = "700 20px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`ĐIỂM  ${score}`, 24, 39);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ff9cae";
        ctx.fillText(`MẠNG  ${"♥".repeat(lives)}${"♡".repeat(3 - lives)}`, width - 24, 39);
        ctx.textAlign = "left";
      }

      function draw(dt) {
        drawBackground(dt);
        for (const object of objects) {
          if (object.type === "coffee") drawCoffee(object.x, object.y, Math.sin(object.phase) * .14);
          else drawAsteroid(object.x, object.y, object.radius, object.phase);
        }
        drawShip();
        drawHud();
        if (hitFlash > 0) {
          ctx.fillStyle = `rgba(255, 75, 110, ${hitFlash * .18})`;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function spawnObject() {
        const type = Math.random() < .58 ? "coffee" : "asteroid";
        objects.push({
          type,
          x: 35 + Math.random() * (width - 70),
          y: -35,
          speed: (type === "coffee" ? 150 : 185) + Math.min(score * 1.3, 100),
          radius: 15 + Math.random() * 6,
          phase: Math.random() * Math.PI * 2
        });
      }

      function update(dt) {
        const direction = (keys.has("ArrowRight") || keys.has("d") || keys.has("D") ? 1 : 0)
          - (keys.has("ArrowLeft") || keys.has("a") || keys.has("A") ? 1 : 0);
        if (direction) player.targetX = player.x + direction * 360 * dt;
        player.targetX = Math.max(34, Math.min(width - 34, player.targetX));
        player.x += (player.targetX - player.x) * Math.min(1, dt * 13);

        spawnTimer += dt;
        if (spawnTimer >= Math.max(.38, .82 - score / 1200)) {
          spawnObject();
          spawnTimer = 0;
        }

        for (const object of objects) {
          object.y += object.speed * dt;
          object.phase += dt * (object.type === "coffee" ? 2 : 1.5);
          if (Math.abs(object.x - player.x) < (object.type === "coffee" ? 28 : object.radius + 22)
              && Math.abs(object.y - player.y) < (object.type === "coffee" ? 29 : object.radius + 22)) {
            if (object.type === "coffee") {
              score += 10;
              object.y = height + 80;
            } else if (hitFlash <= 0) {
              lives -= 1;
              hitFlash = 1;
              object.y = height + 80;
              if (lives <= 0) finishGame();
            }
          }
        }
        objects = objects.filter(object => object.y < height + 45);
        hitFlash = Math.max(0, hitFlash - dt);
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, .04);
        lastTime = time;
        if (state === "playing") update(dt);
        draw(dt);
        requestAnimationFrame(frame);
      }

      function startGame() {
        score = 0;
        lives = 3;
        spawnTimer = .3;
        hitFlash = 0;
        objects = [];
        player.x = width / 2;
        player.targetX = width / 2;
        state = "playing";
        overlay.hidden = true;
        canvas.focus();
      }

      function finishGame() {
        state = "over";
        overlayTitle.textContent = "Hết pin cà phê rồi!";
        overlayCopy.textContent = `Bạn ghi được ${score} điểm. Thử thêm chuyến bay nữa nhé!`;
        startButton.textContent = "Chơi lại";
        overlay.hidden = false;
        startButton.focus();
      }

      function setTargetFromPointer(event) {
        const bounds = canvas.getBoundingClientRect();
        player.targetX = (event.clientX - bounds.left) * width / bounds.width;
      }

      startButton.addEventListener("click", startGame);
      canvas.addEventListener("pointermove", event => {
        if (event.pointerType !== "mouse" || event.buttons) setTargetFromPointer(event);
      });
      canvas.addEventListener("pointerdown", event => {
        canvas.setPointerCapture(event.pointerId);
        setTargetFromPointer(event);
      });
      window.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
        keys.add(event.key);
        if (event.key === " " && state !== "playing") startGame();
      });
      window.addEventListener("keyup", event => keys.delete(event.key));
      window.addEventListener("blur", () => keys.clear());

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
